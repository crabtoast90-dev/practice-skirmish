<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Diorama Skirmish</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%222%22 width=%2212%22 height=%2212%22 rx=%222%22 fill=%22%23c08a55%22/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />

    <canvas id="game"></canvas>
    <div id="title">Diorama Skirmish</div>

    <div id="fps" hidden></div>

    <script type="module" src="./src/main.js"></script>
  </body>
